```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Favelas Recipes AI</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#1e3c72,#2a5298);
}

.card{
background:white;
padding:40px;
width:400px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
animation:fade .7s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1{
text-align:center;
margin-bottom:20px;
}

.input-group{
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:#2a5298;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#1e3c72;
}

.link{
text-align:center;
margin-top:15px;
}

a{
text-decoration:none;
color:#2a5298;
}
</style>

</head>
<body>

<div class="card">

<h1><i class="fa-solid fa-utensils"></i> Favelas Recipes</h1>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Usuario"
required
>

<input
type="password"
id="password"
placeholder="Contraseña"
required
>

<button type="submit">
Iniciar Sesión
</button>

</form>

<script>
document
.getElementById("loginForm")
.addEventListener("submit", async (e)=>{

e.preventDefault();

const response = await fetch(
"/auth/login",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:
document.getElementById("username").value,
password:
document.getElementById("password").value
})
}
);

const data = await response.json();

if(response.ok){

localStorage.setItem(
"token",
data.access_token
);

alert("Login exitoso");

window.location.href =
"/dashboard";

}else{

alert(data.detail);

}

});
</script>

</div>

</body>
</html>
```
