<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Favelas Recipes</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo y título -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-utensils"></i>
                </div>
                <h1>Favelas Recipes</h1>
                <p>Inicia sesión para descubrir recetas increíbles</p>
            </div>

            <!-- Formulario de login -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Correo electrónico
                    </label>
                    <input type="email" id="email" name="email" 
                           placeholder="tu@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Contraseña
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" 
                               placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember">
                        <span class="checkmark"></span>
                        Recordarme
                    </label>
                    <a href="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar Sesión
                </button>
            </form>

            <!-- Separador -->
            <div class="auth-divider">
                <span>o</span>
            </div>

            <!-- Demo credentials -->
            <div class="demo-credentials">
                <p class="demo-title">
                    <i class="fas fa-flask"></i>
                    Credenciales de demostración
                </p>
                <div class="demo-box">
                    <code>demo@favelas.com</code>
                    <span class="demo-sep">•</span>
                    <code>demo123</code>
                </div>
                <button type="button" id="fillDemoBtn" class="btn-demo">
                    <i class="fas fa-robot"></i>
                    Usar demo
                </button>
            </div>

            <!-- Link a registro -->
            <div class="auth-footer">
                <p>¿No tienes cuenta? 
                    <a href="/register" class="register-link">Regístrate gratis</a>
                </p>
            </div>
        </div>

        <!-- Mensaje de error/toast -->
        <div id="toast" class="toast hidden">
            <span class="toast-icon"></span>
            <span class="toast-message"></span>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/login.js') }}"></script>
</body>
</html>
