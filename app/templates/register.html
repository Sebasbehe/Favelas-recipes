<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Favelas Recipes</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/register.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo y título -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-utensils"></i>
                </div>
                <h1>Favelas Recipes</h1>
                <p>Crea tu cuenta y descubre recetas personalizadas</p>
            </div>

            <!-- Formulario de registro -->
            <form id="registerForm" class="auth-form">
                <!-- Nombre completo -->
                <div class="form-group">
                    <label for="fullname">
                        <i class="fas fa-user"></i>
                        Nombre completo
                    </label>
                    <input type="text" id="fullname" name="fullname" 
                           placeholder="Juan Pérez" required autocomplete="name">
                </div>

                <!-- Correo electrónico -->
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Correo electrónico
                    </label>
                    <input type="email" id="email" name="email" 
                           placeholder="tu@email.com" required autocomplete="email">
                    <span class="input-hint">Usaremos este email para tu cuenta</span>
                </div>

                <!-- Nombre de usuario -->
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-at"></i>
                        Nombre de usuario
                    </label>
                    <input type="text" id="username" name="username" 
                           placeholder="juanperez" required autocomplete="username">
                    <span class="input-hint" id="usernameHint">Mínimo 3 caracteres</span>
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Contraseña
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" 
                               placeholder="••••••••" required autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <span class="strength-text">Ingresa una contraseña</span>
                    </div>
                    <ul class="password-requirements">
                        <li id="req-length"><i class="fas fa-circle"></i> Mínimo 8 caracteres</li>
                        <li id="req-upper"><i class="fas fa-circle"></i> Una letra mayúscula</li>
                        <li id="req-number"><i class="fas fa-circle"></i> Un número</li>
                        <li id="req-special"><i class="fas fa-circle"></i> Un carácter especial</li>
                    </ul>
                </div>

                <!-- Confirmar contraseña -->
                <div class="form-group">
                    <label for="confirm_password">
                        <i class="fas fa-check-circle"></i>
                        Confirmar contraseña
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" 
                               placeholder="••••••••" required autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="confirm_password" aria-label="Mostrar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span id="match-message" class="input-hint"></span>
                </div>

                <!-- Términos y condiciones -->
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" required>
                        <span class="checkmark"></span>
                        Acepto los <a href="/terms" target="_blank">Términos y condiciones</a>
                    </label>
                </div>

                <!-- Botón de registro -->
                <button type="submit" class="btn-register" id="registerBtn" disabled>
                    <i class="fas fa-user-plus"></i>
                    Crear cuenta
                </button>
            </form>

            <!-- Separador -->
            <div class="auth-divider">
                <span>o</span>
            </div>

            <!-- Link a login -->
            <div class="auth-footer">
                <p>¿Ya tienes cuenta? 
                    <a href="/login" class="login-link">Iniciar sesión</a>
                </p>
            </div>
        </div>

        <!-- Mensaje de error/toast -->
        <div id="toast" class="toast hidden">
            <span class="toast-icon"></span>
            <span class="toast-message"></span>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/register.js') }}"></script>
</body>
</html>
