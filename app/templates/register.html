```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro</title>

<style>

body{
font-family:Segoe UI;
background:linear-gradient(135deg,#11998e,#38ef7d);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:40px;
width:420px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#11998e;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#0e8078;
}

a{
display:block;
margin-top:15px;
text-align:center;
}
</style>

</head>
<body>

<div class="card">

<h1>Registro</h1>

<form id="registerForm">

<input
type="text"
id="username"
placeholder="Usuario"
required
>

<input
type="email"
id="email"
placeholder="Correo"
required
>

<input
type="password"
id="password"
placeholder="Contraseña"
required
>

<button type="submit">
Registrarse
</button>

</form>

<script>

document
.getElementById("registerForm")
.addEventListener("submit", async(e)=>{

e.preventDefault();

const response = await fetch(
"/auth/register",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username:
document.getElementById("username").value,
email:
document.getElementById("email").value,
password:
document.getElementById("password").value
})
}
);

const data = await response.json();

if(response.ok){

alert(
"Usuario registrado"
);

window.location.href =
"/login";

}else{

alert(data.detail);

}

});

</script>
</div>

</body>
</html>
```
